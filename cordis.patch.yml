# dsh-wechat-channel 的 bundle 补丁层。
#
# 注意包名：npm 上已有一个同名第三方包 `dsh-wechat`（github.com/pan17/dsh-wechat），
# 走腾讯 iLink bot 协议。DSH 的插件世代系统按名字解析依赖，
# 用 `dsh-wechat` 这个名字会被市场版本顶掉（实测踩到过），故改名。
#
# 路由 id 仍保留 `wechat`，这样用户补丁层里 `- id: wechat` 的配置覆盖继续有效。

- insert:
    - id: wechat
      name: 'dsh-wechat-channel'
